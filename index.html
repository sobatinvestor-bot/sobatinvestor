  <!-- PWA: manifest, ikon, & Apple meta (iOS) -->

  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />

  <title>Sobat Investor — Riset Saham IDX Berbasis Data</title>

  <!-- Deskripsi situs (teks "About"). Versi panjangnya:
       "sobatinvestor.com adalah platform edukasi dan asisten riset saham independen yang
        dirancang khusus untuk pasar modal Indonesia (IDX). Visinya: tumbuh menjadi platform
        berbasis data (data-driven) yang membantu investor ritel memahami peluang, risiko,
        dan arah pergerakan pasar saham."
       Di bawah ini sengaja DIPERPENDEK: Google memotong meta description di ~155-160
       karakter, dan versi utuh (282 karakter) akan terpotong di tengah kata. Awalan
       "sobatinvestor.com adalah" juga dibuang karena Google sudah menampilkan URL-nya. -->
  <meta name="description" content="Platform edukasi dan asisten riset saham independen untuk pasar modal Indonesia (IDX). Visinya: tumbuh menjadi platform berbasis data bagi investor ritel." />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://sobatinvestor.com/" />
  <meta property="og:site_name" content="Sobat Investor" />
  <meta property="og:locale" content="id_ID" />
  <meta property="og:title" content="Sobat Investor — Riset saham IDX berbasis data" />
  <!-- Batas Open Graph lebih longgar dari meta description, jadi versi di sini lebih penuh. -->
  <meta property="og:description" content="Platform edukasi dan asisten riset saham independen untuk pasar modal Indonesia (IDX). Visinya: tumbuh menjadi platform berbasis data yang membantu investor ritel memahami peluang dan risiko pasar." />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Sobat Investor" />
  <meta name="twitter:description" content="Platform edukasi & riset saham IDX independen. Bersifat edukatif, bukan nasihat investasi." />

  <!-- Fonts preconnect -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- Fonts: preload + non-blocking (display=swap → teks tampil pakai fallback dulu) -->
